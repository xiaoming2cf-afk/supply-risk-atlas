    key_outputs: [verified chip designs, IP blocks, design signoff artifacts]
    representative_entities: [company:Synopsys, company:Cadence, company:Siemens_EDA, company:Arm]
    concentration_risk: high
    substitutability: low
    lead_time_or_switching_cost_notes: Tool and IP switching requires qualification, retraining, and signoff-cycle changes.
    shock_sensitivity: policy, license, and capability disruptions can delay tape-out and product qualification.
    downstream_impact: Delays advanced logic, AI accelerator, automotive, and communications chip design.
    evidence_summary: Public filings, OECD, OpenAlex/Crossref, and company report summaries support this layer.
