coverage_gaps:
  - Private supplier transactions, order books, capacity reservations, and customer shares are not represented.
  - Capacity shares, demand values, and substitution lead times are fixture proxies unless directly disclosed in public summaries.
  - Non-US annual reports are manual-upload or summarized fixtures unless already mapped in public evidence.
  - Chokepoint severity is not calibrated against real outage outcomes.
